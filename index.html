 const st=[['شغالين الآن',a.length],['موتوسيكل',c('moto')],['توكتوك',c('tuk')],['رحلات النهارده',trips.length]];
 const ch=trips.filter(t=>t.s!=='new');
 return banner()+head(ICON_G,'المناديب الشغالين دلوقتي','')+`<div class="stats">${st.map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div></section>`+
 `<section class="card"><div class="ch"><h2>إشعارات الرحلات</h2></div>${ch.length?ch.map(t=>`<div class="row"><div><b>${esc(t.by)} ${t.s==='ok'?'وافق على':'رفض'} رحلة</b><small><span class="vb">${VL[t.vehicle]||''}</span>من ${esc(t.from)} إلى ${esc(t.to)}</small></div><span class="p">${esc(t.price)} جنيه</span></div>`).join(''):'<p class="m">لسه مفيش رد على أي رحلة.</p>'}</section>`;
}
function render(){
 root.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
 $('#cnt').textContent=live?drivers.length:(driver&&driver.on?1:0);
 $('#v').innerHTML=cur==='customer'?customerV():cur==='driver'?driverV():ownerV();
 upd();
}
function upd(){
 const i=[...root.querySelectorAll('#v input')];const b=root.querySelector('#v .go[data-a="creg"],#v .go[data-a="dreg"],#v .go[data-a="send"]');
 if(!b)return;let ok=i.every(x=>x.value.trim());
 if(b.dataset.a==='send')ok=ok&&!!vsel;
 if(b.dataset.a==='dreg')ok=ok&&/^\d{14}$/.test(i[2].value.trim());
 b.disabled=!ok;
}
async function api(method,body){
 const r=await fetch(API_URL,method==='GET'?{}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
 return r.json();
}
async function refresh(){
 if(!live)return;
 try{
  const d=await api('GET');
  trips=(d.trips||[]).map(t=>({id:t.id,c:t.customer,from:t.pickup,to:t.dest,price:t.price,vehicle:t.vehicle,s:t.status==='pending'?'new':t.status==='accepted'?'ok':'no',by:t.driver})).reverse();
  drivers=(d.drivers||[]).map(x=>({name:x.name,v:x.vehicle}));
  error='';
 }catch(e){error='مش قادر أوصل للسيرفر، هحاول تاني.'}
 if(!root.querySelector('#v input:focus'))render();
}
async function ping(){if(live&&driver&&driver.on){try{await api('POST',{action:'ping',name:driver.name,vehicle:driver.v,on:true})}catch(e){}}}
root.addEventListener('input',upd);
root.addEventListener('click',async e=>{
 const t=e.target.closest('.tab');if(t){cur=t.dataset.t;render();return}
 if(e.target.closest('#copy')){const u=location.href.split('#')[0]+'#driver';(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).catch(()=>{}).finally(()=>{const x=$('#toast');x.style.display='block';setTimeout(()=>x.style.display='none',1800)});return}
 const vs=e.target.closest('[data-vs]');if(vs){vsel=vs.dataset.vs;root.querySelectorAll('[data-vs]').forEach(x=>x.classList.toggle('on',x===vs));upd();return}
 const v=e.target.closest('.choice button');if(v){root.querySelectorAll('.choice button').forEach(x=>x.classList.toggle('on',x===v));return}
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const I=[...root.querySelectorAll('#v input')].map(x=>x.value.trim());const a=b.dataset.a;
 try{
 if(a==='creg')customer={name:I[0],phone:I[1],sent:false};
 else if(a==='send'){customer.from=I[0];customer.to=I[1];customer.price=I[2];customer.sent=true;
  if(live){await api('POST',{action:'request',customer:customer.name,phone:customer.phone,pickup:I[0],dest:I[1],price:I[2],vehicle:vsel});await refresh()}
  else trips.unshift({id:String(nid++),c:customer.name,from:I[0],to:I[1],price:I[2],vehicle:vsel,s:'new'})}
 else if(a==='dreg'){const on=root.querySelector('.choice .on');driver={name:I[0],phone:I[1],v:on&&on.dataset.v,on:false};if(live)await api('POST',{action:'register',name:I[0],phone:I[1],nid:I[2],vehicle:driver.v})}
 else if(a==='tog'){driver.on=!driver.on;if(live){await api('POST',{action:'ping',name:driver.name,vehicle:driver.v,on:driver.on});await refresh()}}
 else{const r=trips.find(x=>String(x.id)===b.dataset.id);if(r){r.s=a==='yes'?'ok':'no';r.by=driver.name;if(live){await api('POST',{action:a==='yes'?'accept':'reject',id:r.id,driver:driver.name});await refresh()}}}
 }catch(err){error='حصلت مشكلة في الاتصال. جرّب تاني.'}
 render();
});
render();
if(live){refresh();setInterval(refresh,5000);setInterval(ping,30000)}
}
